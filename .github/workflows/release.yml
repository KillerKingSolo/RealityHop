name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the build tools run below must not find a token that can push

      - name: Refuse the release while the backend is out of date
        run: python tools/check-backend.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Version from the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}   # through the environment: a tag name must not become part of the script
        run: |
          $v = $env:TAG.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0' }
          "VERSION = '$v'" | Set-Content -Encoding ascii src/version.py

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Release notes from CHANGELOG.md, with the checksum
        shell: pwsh
        run: |
          $v = (Get-Content src/version.py -Raw) -replace "(?s).*VERSION = '([^']+)'.*", '$1'
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'See CHANGELOG.md.' }
          $h = (Get-FileHash dist/RealityHop.exe -Algorithm SHA256).Hash.ToLower()
          $src = "**Where the nodes come from:** the public node list [rtwo2/FastNodes](https://github.com/rtwo2/FastNodes), tested by Reality Hop on your PC. Tunnel engine: [SagerNet/sing-box](https://github.com/SagerNet/sing-box)."
          $tail = "$src`n`n**Install or update:** download ``RealityHop.exe`` and run it. Installed copies update themselves. All changes: [CHANGELOG.md](https://github.com/KillerKingSolo/RealityHop/blob/main/CHANGELOG.md).`n`n**SHA-256 of RealityHop.exe:** ``$h``"
          "$notes`n`n---`n`n$tail" | Set-Content -Encoding utf8 dist/notes.md
          Get-Content dist/notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/RealityHop.exe
          body_path: dist/notes.md

      - name: Keep the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RealityHop
          path: dist/RealityHop.exe
