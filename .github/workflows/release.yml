name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the build tools run below must not find a token that can push

      - name: Refuse the release while the backend is out of date
        run: python tools/check-backend.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Version from the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}   # through the environment: a tag name must not become part of the script
        run: |
          $v = $env:TAG.TrimStart('v')
          if ($v -match '^\d+\.\d+\.\d+$') { "VERSION = '$v'" | Set-Content -Encoding ascii src/version.py }   # a manual run keeps the version in the code

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RealityHop-windows
          path: dist/RealityHop.exe

  mac:   # build only, so the tests on every macOS version can start as soon as possible
    permissions:
      contents: read   # builds and tests only; publish is the one job that writes
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple silicon
            chip: apple-silicon
          - runner: macos-15-intel   # Intel
            chip: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mac.txt

      - name: Version from the tag
        env:
          TAG: ${{ github.ref_name }}   # through the environment: a tag name must not become part of the script
        run: |
          v="${TAG#v}"
          if echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "VERSION = '$v'" > src/version.py; fi   # a manual run keeps the version in the code

      - name: Build
        run: sh build-mac.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RealityHop-mac-${{ matrix.chip }}
          path: dist/RealityHop-mac-${{ matrix.chip }}.dmg

  mac-smoke:   # from source, alongside the build: sing-box, nodes, tunnel, login items, menu bar icon, uninstall
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install
        run: pip install -r requirements.txt -r requirements-mac.txt

      - name: Smoke test from source
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only use: GitHub API lookups of the sing-box releases
        run: |
          export RH_SMOKE_HOME="$RUNNER_TEMP/smoke-home" SHOTS="$RUNNER_TEMP/shots"
          mkdir -p "$RH_SMOKE_HOME" "$SHOTS"
          HOME="$RH_SMOKE_HOME" python tools/mac-smoke.py
          sleep 5
          test ! -d "$RH_SMOKE_HOME/Library/Application Support/RealityHop"
          echo "PASS  uninstall: data folder removed"

      - name: Window test from source (wizard pages, Install, Finish, main window, Settings, Stop, Start, report, Uninstall)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export RH_SMOKE_HOME="$RUNNER_TEMP/gui-home" SHOTS="$RUNNER_TEMP/shots"
          mkdir -p "$RH_SMOKE_HOME"
          HOME="$RH_SMOKE_HOME" python tools/mac-gui-test.py

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-smoke-${{ matrix.runner }}
          path: ${{ runner.temp }}/shots

  mac-test:   # the built apps on macOS 15, 26 and 27, and the Intel app on Apple silicon (Rosetta)
    needs: mac
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15           # macOS 15, Apple silicon
            chip: apple-silicon
          - runner: macos-15-intel     # macOS 15, Intel
            chip: intel
          - runner: macos-26           # macOS 26, Apple silicon
            chip: apple-silicon
          - runner: macos-26-intel     # macOS 26, Intel
            chip: intel
          - runner: macos-26           # the Intel app on Apple silicon, through Rosetta
            chip: intel
            rosetta: true
          - runner: xcode-27           # macOS 27 (GitHub preview image), Apple silicon only
            chip: apple-silicon
          - runner: xcode-27           # macOS 27, the Intel app through Rosetta
            chip: intel
            rosetta: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RealityHop-mac-${{ matrix.chip }}
          path: dist

      - name: Rosetta on this runner
        if: matrix.rosetta
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Test the built app (disk image, start from the dmg, language, wizard, watcher, self-update)
        run: python3 tools/mac-app-test.py "dist/RealityHop-mac-${{ matrix.chip }}.dmg" ${{ matrix.chip }} "$RUNNER_TEMP/shots"   # the runner's own Python: the test needs only the standard library

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.runner }}-${{ matrix.chip }}${{ matrix.rosetta && '-rosetta' || '' }}
          path: ${{ runner.temp }}/shots

  publish:
    needs: [build, mac, mac-smoke, mac-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: RealityHop-*
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md, with the checksums
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG.TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'See CHANGELOG.md.' }
          $files = 'RealityHop.exe', 'RealityHop-mac-apple-silicon.dmg', 'RealityHop-mac-intel.dmg'
          $sums = ($files | ForEach-Object { "**SHA-256 of ${_}:** ``$((Get-FileHash "dist/$_" -Algorithm SHA256).Hash.ToLower())``" }) -join "`n`n"
          $src = "**Where the nodes come from:** the public node list [rtwo2/FastNodes](https://github.com/rtwo2/FastNodes), tested by Reality Hop on your PC. Tunnel engine: [SagerNet/sing-box](https://github.com/SagerNet/sing-box)."
          $win = "**Windows:** download ``RealityHop.exe`` and run it."
          $mac = "**Mac:** download ``RealityHop-mac-apple-silicon.dmg`` (M1 and newer) or ``RealityHop-mac-intel.dmg`` (Intel), open it and drag Reality Hop to Applications. The first time, right-click Reality Hop and choose Open: the app is not notarized by Apple."
          $tail = "$src`n`n$win`n`n$mac`n`nInstalled copies update themselves. All changes: [CHANGELOG.md](https://github.com/KillerKingSolo/RealityHop/blob/main/CHANGELOG.md).`n`n$sums"
          "$notes`n`n---`n`n$tail" | Set-Content -Encoding utf8 dist/notes.md
          Get-Content dist/notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/RealityHop.exe
            dist/RealityHop-mac-apple-silicon.dmg
            dist/RealityHop-mac-intel.dmg
          body_path: dist/notes.md
          fail_on_unmatched_files: true
