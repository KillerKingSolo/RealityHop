name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version from the tag
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+') { $v = '0.0.0' }
          "VERSION = '$v'" | Set-Content -Encoding ascii src/version.py

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Release notes from CHANGELOG.md, with the checksum
        shell: pwsh
        run: |
          $v = (Get-Content src/version.py -Raw) -replace "(?s).*VERSION = '([^']+)'.*", '$1'
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'See CHANGELOG.md.' }
          $h = (Get-FileHash dist/RealityHop.exe -Algorithm SHA256).Hash.ToLower()
          $src = "**Where the nodes come from:** the public node list [rtwo2/FastNodes](https://github.com/rtwo2/FastNodes), tested by RealityHop on your PC. Tunnel engine: [SagerNet/sing-box](https://github.com/SagerNet/sing-box)."
          $tail = "$src`n`n**Install or update:** download ``RealityHop.exe`` and run it. Installed copies update themselves. All changes: [CHANGELOG.md](https://github.com/KillerKingSolo/RealityHop/blob/main/CHANGELOG.md).`n`n**SHA-256 of RealityHop.exe:** ``$h``"
          "$notes`n`n---`n`n$tail" | Set-Content -Encoding utf8 dist/notes.md
          Get-Content dist/notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RealityHop.exe
          body_path: dist/notes.md

      - name: Keep the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: RealityHop
          path: dist/RealityHop.exe
