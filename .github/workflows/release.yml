name: release

on:
  push:
    tags: ['v*']   # vX.Y.Z, or vX.Y.Z-beta.N for a prerelease (releases/latest skips it, so installed copies stay put)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:   # format, lints, tests on every platform, parity with the Python code, and cargo-deny, on the tagged commit
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml
    with:
      release: true

  build:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the build tools run below must not find a token that can push

      - name: Refuse the release while the backend is out of date
        run: python tools/check-backend.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: The tag matches the version in rust/Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}   # through the environment: a tag name must not become part of the script
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          t="${TAG#v}"; t="${t%%-*}"
          [ "$t" = "$v" ] || { echo "tag $TAG does not match version $v in rust/Cargo.toml"; exit 1; }

      - name: Build (MSVC, so the WebView2 loader is linked in)
        working-directory: rust
        run: |
          rustup toolchain install
          cargo build --locked --release -p realityhop-app
          mkdir -p dist && cp target/release/RealityHop.exe dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RealityHop-windows
          path: rust/dist/RealityHop.exe

  mac-intel:   # build only; one job per chip, so each chip's tests start as soon as its own build is done
    permissions:
      contents: read   # builds and tests only; publish is the one job that writes
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            chip: intel
    runs-on: ${{ matrix.runner }}
    steps: &mac-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        working-directory: rust
        run: |
          rustup toolchain install
          sh build-mac.sh

      - name: Update from this dmg into a copy of the app, router key script
        working-directory: rust
        run: RH_TEST_DMG="$PWD/dist/RealityHop-mac-${{ matrix.chip }}.dmg" cargo test --locked -p realityhop-engine --test mac_release -- --nocapture

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RealityHop-mac-${{ matrix.chip }}
          path: rust/dist/RealityHop-mac-${{ matrix.chip }}.dmg

  mac-apple-silicon:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: macos-15
            chip: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps: *mac-build

  test-apple-silicon:   # the Apple silicon app on macOS 15, 26 and 27
    needs: mac-apple-silicon
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            chip: apple-silicon
          - runner: macos-26
            chip: apple-silicon
          - runner: xcode-27           # macOS 27 (GitHub preview image)
            chip: apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30   # a hung app start fails the job instead of holding the runner
    steps: &mac-test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RealityHop-mac-${{ matrix.chip }}
          path: dist

      - name: Rosetta on this runner
        if: matrix.rosetta
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Test the built app (disk image, start from the dmg, language, wizard, watcher, self-update)
        run: python3 tools/mac-app-test.py "dist/RealityHop-mac-${{ matrix.chip }}.dmg" ${{ matrix.chip }} "$RUNNER_TEMP/shots"   # the runner's own Python: the test needs only the standard library

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.runner }}-${{ matrix.chip }}${{ matrix.rosetta && '-rosetta' || '' }}
          path: ${{ runner.temp }}/shots

  test-intel:   # the Intel app on macOS 15 and 26, and on Apple silicon through Rosetta (macOS 26 and 27)
    needs: mac-intel
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            chip: intel
          - runner: macos-26-intel
            chip: intel
          - runner: macos-26
            chip: intel
            rosetta: true
          - runner: xcode-27
            chip: intel
            rosetta: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps: *mac-test

  publish:
    needs: [checks, build, mac-intel, mac-apple-silicon, test-apple-silicon, test-intel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: RealityHop-*
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md, with the checksums
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG.TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'See CHANGELOG.md.' }
          $files = 'RealityHop.exe', 'RealityHop-mac-apple-silicon.dmg', 'RealityHop-mac-intel.dmg'
          $sums = ($files | ForEach-Object { "**SHA-256 of ${_}:** ``$((Get-FileHash "dist/$_" -Algorithm SHA256).Hash.ToLower())``" }) -join "`n`n"
          $src = "**Where the nodes come from:** the public node list [rtwo2/FastNodes](https://github.com/rtwo2/FastNodes), tested by Reality Hop on your PC. Tunnel engine: [SagerNet/sing-box](https://github.com/SagerNet/sing-box)."
          $win = "**Windows:** download ``RealityHop.exe`` and run it."
          $mac = "**Mac:** download ``RealityHop-mac-apple-silicon.dmg`` (M1 and newer) or ``RealityHop-mac-intel.dmg`` (Intel), open it and drag Reality Hop to Applications. The first time, right-click Reality Hop and choose Open: the app is not notarized by Apple."
          $tail = "$src`n`n$win`n`n$mac`n`nInstalled copies update themselves. All changes: [CHANGELOG.md](https://github.com/KillerKingSolo/RealityHop/blob/main/CHANGELOG.md).`n`n$sums"
          "$notes`n`n---`n`n$tail" | Set-Content -Encoding utf8 dist/notes.md
          Get-Content dist/notes.md
          "| Asset | Size |`n|---|---|" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $files | ForEach-Object { "| $_ | $([math]::Round((Get-Item "dist/$_").Length / 1MB, 1)) MB |" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/RealityHop.exe
            dist/RealityHop-mac-apple-silicon.dmg
            dist/RealityHop-mac-intel.dmg
          body_path: dist/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
