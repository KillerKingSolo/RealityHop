name: rust

on:
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust.yml']
  workflow_dispatch:
  workflow_call:   # the release runs these checks on the tagged commit first

permissions:
  contents: read

jobs:
  test:   # format, lints and tests on every platform the app ships for: macOS 15, 26 and 27, Apple silicon and Intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, os: Windows }
          - { runner: macos-15, os: 'macOS 15, Apple silicon' }
          - { runner: macos-15-intel, os: 'macOS 15, Intel' }
          - { runner: macos-26, os: 'macOS 26, Apple silicon' }
          - { runner: macos-26-intel, os: 'macOS 26, Intel' }
          - { runner: xcode-27, os: 'macOS 27, Apple silicon' }   # xcode-27: macOS 27 (GitHub preview image)
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  deny:   # vulnerabilities, licenses and sources of every crate
    name: crate audit (vulnerabilities, licenses, sources)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-deny@0.22.1
      - run: cargo deny --locked check
