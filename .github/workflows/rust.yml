name: rust

on:
  push:
    branches: [rust]
    paths: ['rust/**', 'src/**', 'tools/parity-dump.py', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'src/**', 'tools/parity-dump.py', '.github/workflows/rust.yml']
  workflow_dispatch:
  workflow_call:   # the release runs these checks on the tagged commit first
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:   # format, lints and tests on every platform the app ships for: macOS 15, 26 and 27, Apple silicon and Intel
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel, macos-26, macos-26-intel, xcode-27]   # xcode-27: macOS 27 (GitHub preview image)
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:   # test builds to try by hand: the Windows exe (MSVC links the WebView2 loader in) and the Apple silicon dmg
    if: ${{ !inputs.release }}   # the release builds its own
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Windows exe
        if: runner.os == 'Windows'
        run: |
          cargo build --locked --release -p realityhop-app
          mkdir -p dist && cp target/release/RealityHop.exe dist/
      - name: macOS dmg
        if: runner.os == 'macOS'
        run: sh build-mac.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-${{ runner.os }}
          path: rust/dist/*
          retention-days: 7

  parity:   # the fixtures still match what the Python code returns
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -I tools/parity-dump.py --check

  deny:   # vulnerabilities, licenses and sources of every crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-deny@0.21.0
      - run: cargo deny --locked check
