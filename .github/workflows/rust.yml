name: rust

on:
  push:
    branches: [rust]
    paths: ['rust/**', 'src/**', 'tools/parity-dump.py', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'src/**', 'tools/parity-dump.py', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:   # format, lints and tests on every platform the app ships for
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  parity:   # the fixtures still match what the Python code returns
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -I tools/parity-dump.py --check

  deny:   # vulnerabilities, licenses and sources of every crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-deny@0.21.0
      - run: cargo deny --locked check
