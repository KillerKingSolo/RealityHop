# cargo deny check: known vulnerabilities, licenses, duplicate crates, and crates from crates.io only

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
private = { ignore = true }
unused-allowed-license = "allow"   # the list covers crates later phases add

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # this workspace's own crates point at each other by path

[sources]
unknown-registry = "deny"
unknown-git = "deny"
