[workspace]
resolver = "3"
members = ["engine", "cli", "app", "tools"]

[workspace.package]
version = "2.1.5"
edition = "2024"
rust-version = "1.100"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/KillerKingSolo/RealityHop"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
