[package]
name = "realityhop-app"
description = "Reality Hop: the window, the tray icon and the background watcher in one process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "RealityHop"
path = "src/main.rs"

[dependencies]
realityhop-engine = { path = "../engine" }
serde_json.workspace = true
tauri = { version = "=2.12.7", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-notification = "=2.8.1"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }
