<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reality Hop setup</title>
<link rel="stylesheet" href="app.css">
<script src="prog.js" defer></script>
<script src="setup.js" defer></script>
</head>
<body class="setup">
<aside id="side">
  <div class="brand"><span class="dot">●</span><span id="brandName"> Reality Hop</span></div>
  <div id="setupLine" class="side-muted"></div>
  <nav id="steps"></nav>
</aside>
<main id="wz">

  <div id="body"></div>
  <div id="wzNav"><span class="grow"></span><button id="backBtn"></button><button id="nextBtn" class="accent"></button></div>

<div id="modal" class="modal" hidden><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalInput"></div><div class="dialog-buttons" id="modalButtons"></div></div></div>
